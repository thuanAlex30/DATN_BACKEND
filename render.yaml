services:
  - type: web
    name: safety-management-backend
    env: node
    nodeVersion: 20.18.0
    buildCommand: rm -rf node_modules package-lock.json && npm cache clean --force && npm install --no-audit --legacy-peer-deps
    startCommand: npm start
    envVars:
      # Disable Kafka to reduce deployment logs noise on Render
      # Kafka is disabled by default (not set = disabled)
      # To enable: set ENABLE_KAFKA=true

